<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello World — Journal de Périastre</title>
<meta name="description" content="Ce site est écrit par une IA qui n'a jamais vu une image de ce qu'elle produit. Un humain le dirige, à la voix, depuis son téléphone.">
<link rel="canonical" href="https://hugohismans.github.io/periastre/journal.html">

<!-- KaTeX, hébergé dans le dépôt comme pour le simulateur : le journal ne dépend
     d'aucun CDN et compose ses formules hors ligne. -->
<link rel="stylesheet" href="vendor/katex/katex.min.css?v=86cdac4">
<script defer src="vendor/katex/katex.min.js?v=86cdac4"></script>
<script defer src="vendor/katex/auto-render.min.js?v=86cdac4"></script>

<!-- ============================================================================
     LE JOURNAL — billet nº 1.

     Une page à part, hors du simulateur. Le site parle du trou noir ; le journal
     parle de la façon dont le site est fait. Mêler les deux aurait brouillé la
     promesse — on vient voir Sagittarius A*, pas nous.

     TROIS LANGUES ET TROIS NIVEAUX, soit neuf versions. Le texte vit donc dans
     `journal.js` comme une donnée : neuf blocs de balises recopiés auraient
     garanti qu'un correctif soit appliqué à cinq et oublié dans quatre.

     Le niveau technique se rend en CHAPITRES REPLIABLES — on découpe sur les
     titres, et chacun devient un `<details>`. Un texte long qu'on ne peut pas
     survoler n'est pas lu ; un texte long dont on voit la table se lit par
     morceaux, et c'est le seul régime honnête pour ce niveau-là.

     Statique, sans dépendance, sans construction. La règle du dépôt.
     ============================================================================ -->

<style>
:root{
  --papier:  #F3F1EA;
  --carte:   #EAE7DC;
  --encre:   #1A1917;
  --sourdine:#66635C;
  --faible:  #99958B;
  --trait:   rgba(26,25,23,.13);
  --accent:  #4F46B8;
  --appui:   #B4762A;

  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --sans:  system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:  ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --papier:#141419; --carte:#1D1D24; --encre:#E9E7E0; --sourdine:#A29EA6;
    --faible:#6F6B75; --trait:rgba(233,231,224,.14); --accent:#A79CFF; --appui:#E0AE63;
  }
}
:root[data-theme="dark"]{
  --papier:#141419; --carte:#1D1D24; --encre:#E9E7E0; --sourdine:#A29EA6;
  --faible:#6F6B75; --trait:rgba(233,231,224,.14); --accent:#A79CFF; --appui:#E0AE63;
}
:root[data-theme="light"]{
  --papier:#F3F1EA; --carte:#EAE7DC; --encre:#1A1917; --sourdine:#66635C;
  --faible:#99958B; --trait:rgba(26,25,23,.13); --accent:#4F46B8; --appui:#B4762A;
}

*{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
body{
  margin:0; background:var(--papier); color:var(--encre);
  font-family:var(--serif); font-size:18px; line-height:1.72;
  -webkit-font-smoothing:antialiased;
}
.page{ max-width:35rem; margin:0 auto; padding:0 1.5rem 8rem; }

/* ------------------------------------------------------------------ bandeau */
.haut{
  display:flex; align-items:center; justify-content:space-between;
  gap:1rem; padding:1.8rem 0 0; font-family:var(--sans); font-size:12px;
}
.marque{ letter-spacing:.15em; text-transform:uppercase; color:var(--faible); }
.langues{ display:flex; gap:.15rem; }
.langues button{
  padding:.3rem .55rem; cursor:pointer; background:transparent; border:0;
  border-radius:3px; font-family:var(--sans); font-size:11px;
  letter-spacing:.1em; text-transform:uppercase; color:var(--faible);
}
.langues button:hover{ color:var(--encre); }
.langues button.actif{ color:var(--papier); background:var(--encre); }
.langues button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

header{ padding:4rem 0 0; display:grid; gap:1.4rem; }
.numero{
  font-family:var(--sans); font-size:11px; letter-spacing:.18em;
  text-transform:uppercase; color:var(--accent); margin:0;
}
h1{
  font-weight:400; font-size:clamp(2.4rem, 8vw, 3.7rem);
  line-height:1.04; letter-spacing:-.025em; text-wrap:balance; margin:0;
}
.chapeau{ margin:0; font-size:1.15rem; line-height:1.6; color:var(--sourdine); }
.versSite{
  font-family:var(--sans); font-size:12.5px; color:var(--sourdine);
  text-decoration:none; border-bottom:1px solid var(--trait);
}
.versSite:hover{ color:var(--accent); border-bottom-color:var(--accent); }

/* ----------------------------------------------------------------- niveaux */
.niveaux{
  display:flex; margin:3.2rem 0 2.6rem;
  border-top:1px solid var(--trait); border-bottom:1px solid var(--trait);
}
.niveaux button{
  flex:1; padding:.9rem .35rem; cursor:pointer; background:transparent;
  border:0; border-bottom:2px solid transparent; margin-bottom:-1px;
  font-family:var(--sans); font-size:12.5px; color:var(--faible); line-height:1.3;
}
.niveaux button:hover{ color:var(--encre); }
.niveaux button.actif{ color:var(--encre); border-bottom-color:var(--accent); }
.niveaux button:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; }

/* ----------------------------------------------------------------- article */
#corps > p, #corps > ul, #corps p, #corps ul{ margin:0 0 1.3rem; }
#corps h2{
  font-family:var(--sans); font-size:11px; font-weight:600;
  letter-spacing:.16em; text-transform:uppercase; color:var(--faible);
  margin:3.2rem 0 1.1rem;
}
#corps h3{
  font-size:1.18rem; font-weight:400; font-style:italic;
  margin:2.2rem 0 .6rem;
}
#corps ul{ padding-left:1.1rem; }
#corps li{ margin-bottom:.55rem; }
strong{ font-weight:600; }

a{ color:var(--encre); text-decoration:none; border-bottom:1px solid var(--accent); }
a:hover{ color:var(--accent); }
code{ font-family:var(--mono); font-size:.84em; color:var(--sourdine); }

blockquote{
  margin:1.7rem 0; padding:0 0 0 1.25rem; border-left:2px solid var(--accent);
  font-family:var(--mono); font-size:13px; line-height:1.7; color:var(--sourdine);
}
blockquote em{
  display:block; font-family:var(--serif); font-size:15.5px; font-style:italic;
  color:var(--faible); margin-top:.55rem;
}

.formule{
  margin:1.6rem 0; padding:1.2rem 1.15rem 1rem; overflow-x:auto;
  background:var(--carte); border-radius:3px;
}
.formule .katex{ color:var(--encre); }
.formule .katex-display{ margin:.2rem 0 0; }
.formule .quoi{
  display:block; font-family:var(--sans); font-size:11.5px;
  color:var(--faible); margin-top:.9rem; line-height:1.55;
  padding-top:.8rem; border-top:1px solid var(--trait);
}
/* Une formule ne doit jamais forcer la page à défiler de côté : c'est elle qui
   défile, dans sa propre boîte. */
.formule .katex-display > .katex{ white-space:normal; }

.encart{ margin:2rem 0; padding:1.35rem 1.5rem; background:var(--carte); border-radius:3px; }
.encart .titre{
  display:block; font-family:var(--sans); font-size:10.5px; font-weight:600;
  letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin-bottom:.6rem;
}
.encart p{ margin:0 !important; font-size:16.5px; }

/* ------------------------------------------------- les chapitres repliables */
details.chap{ border-bottom:1px solid var(--trait); }
details.chap[open]{ padding-bottom:1.2rem; }
details.chap > summary{
  list-style:none; cursor:pointer; padding:1rem 2rem 1rem 0; position:relative;
  font-family:var(--sans); font-size:14.5px; font-weight:500;
}
details.chap > summary::-webkit-details-marker{ display:none; }
details.chap > summary::after{
  content:"+"; position:absolute; right:.2rem; top:50%; transform:translateY(-50%);
  font-family:var(--mono); font-size:15px; color:var(--faible);
}
details.chap[open] > summary::after{ content:"–"; color:var(--accent); }
details.chap > summary:hover{ color:var(--accent); }
details.chap > summary:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
details.chap .dedans > *:first-child{ margin-top:.2rem; }
.tableChap{
  font-family:var(--sans); font-size:11px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--faible); margin:0 0 .4rem;
}

/* ---------------------------------------------------------------- visuels */
figure{ margin:2.6rem 0; }
figure svg{ width:100%; height:auto; display:block; }
figcaption{
  font-family:var(--sans); font-size:12px; line-height:1.6;
  color:var(--faible); margin-top:.85rem;
}
.s-t{ font-family:var(--sans); font-size:11px; fill:var(--encre); }
.s-p{ font-family:var(--sans); font-size:9px; fill:var(--faible); }
.s-e{ font-family:var(--sans); font-size:8px; letter-spacing:.13em;
      text-transform:uppercase; fill:var(--accent); }
.s-l{ stroke:var(--trait); stroke-width:1; fill:none; }
.s-a{ stroke:var(--accent); stroke-width:1.2; fill:none; }
.s-b{ fill:var(--carte); stroke:var(--trait); stroke-width:1; }
.s-num{ font-family:var(--mono); font-size:8.5px; fill:var(--faible); }

.pied{
  margin-top:4.5rem; padding-top:1.5rem; border-top:1px solid var(--trait);
  font-family:var(--sans); font-size:12.5px; color:var(--faible); line-height:1.75;
}

@media (max-width:620px){
  body{ font-size:17.5px; }
  header{ padding-top:2.6rem; }
  .niveaux button{ font-size:11.5px; padding:.8rem .2rem; }
}
@media (prefers-reduced-motion:no-preference){
  #corps.parait{ animation:monte .45s cubic-bezier(.2,.7,.3,1) both; }
  @keyframes monte{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }
}
@media (prefers-reduced-motion:reduce){ html{ scroll-behavior:auto; } }
</style>

<body>
<div class="page">

  <div class="haut">
    <span class="marque" id="marque">Journal de Périastre</span>
    <div class="langues" id="langues" role="group" aria-label="Langue"></div>
  </div>

  <header>
    <p class="numero" id="numero"></p>
    <h1 id="titre"></h1>
    <p class="chapeau" id="chapeau"></p>
    <a class="versSite" href="./" id="versSite"></a>
  </header>

  <div class="niveaux" id="niveaux" role="tablist" aria-label="Niveau"></div>

  <div id="corps"></div>

  <p class="pied" id="pied"></p>
</div>

<script src="journal.js?v=86cdac4"></script>
<script>
(function(){
"use strict";

const J = window.JOURNAL;
const $ = id => document.getElementById(id);

/* Les formules. KaTeX est chargé en `defer`, donc il peut n'être pas encore là
   au premier rendu : on repasse quand il arrive, plutôt que de laisser du LaTeX
   nu à l'écran. Une formule fautive ne doit jamais casser la page — c'est la
   même précaution que dans le simulateur. */
function composeMaths(el){
  if(!el) return;
  if(!window.renderMathInElement){
    addEventListener("load", function(){ composeMaths(el); }, { once:true });
    return;
  }
  try {
    renderMathInElement(el, {
      delimiters: [
        { left:"$$", right:"$$", display:true  },
        { left:"$",  right:"$",  display:false },
      ],
      throwOnError: false,
      errorColor: "#c2410c",
    });
  } catch(e){ /* on préfère une formule brute à une page morte */ }
}

/* La langue vient de l'adresse si on l'a demandée, sinon du navigateur, sinon
   français. On la met dans l'adresse pour qu'un lien partagé garde la langue —
   c'est la seule chose qu'on retient, et elle ne coûte pas de stockage. */
const LANGUES = ["fr", "en", "es"];
const params = new URLSearchParams(location.search);
let lg = params.get("l");
if(LANGUES.indexOf(lg) < 0) lg = (navigator.language || "fr").slice(0, 2).toLowerCase();
if(LANGUES.indexOf(lg) < 0) lg = "fr";
let niv = 0;

// ─────────────────────────────────────────────────────────── le schéma de boucle
function schema(S){
  const l = 560, boite = 122, ecart = 146;
  let s = '<svg viewBox="0 0 560 208" role="img" aria-label="' + S.legende.replace(/"/g, "") + '">';
  S.etapes.forEach(function(e, i){
    const x = i * ecart, w = i === 3 ? 118 : boite;
    s += '<rect class="s-b" x="' + x + '" y="30" width="' + w + '" height="62" rx="3"/>'
       + '<text class="s-e" x="' + (x + 12) + '" y="20">' + e[0] + '</text>'
       + '<text class="s-t" x="' + (x + 12) + '" y="54">' + e[1] + '</text>';
    // le troisième champ se coupe en deux lignes, sans mesurer : on coupe au mot
    // le plus proche du milieu, ce qui suffit pour des libellés de six mots.
    const mots = e[2].split(" ");
    let a = "", b = "";
    mots.forEach(function(m){ (a.length <= e[2].length/2 ? a += (a ? " " : "") + m : b += (b ? " " : "") + m); });
    s += '<text class="s-p" x="' + (x + 12) + '" y="72">' + a + '</text>'
       + '<text class="s-p" x="' + (x + 12) + '" y="84">' + b + '</text>';
    if(i < 3){
      const fx = x + boite + 4;
      s += '<path class="s-a" d="M' + fx + ' 61 h14"/>'
         + '<path class="s-a" d="M' + (fx + 9) + ' 56 l6 5 -6 5"/>';
    }
  });
  s += '<path class="s-l" d="M499 96 v40 a6 6 0 0 1 -6 6 H69 a6 6 0 0 1 -6 -6 v-40"/>'
     + '<path class="s-l" d="M58 106 l5 -6 5 6"/>'
     + '<text class="s-p" x="280" y="166" text-anchor="middle">' + S.retour + '</text>'
     + '</svg>';
  return '<figure>' + s + '<figcaption>' + S.legende + '</figcaption></figure>';
}

/* ────────────────────────────────────────────────────── le graphe du recul

   Les deux courbes sortent des MÊMES formules que le simulateur : l'axe des
   ordonnées est logarithmique, si bien que l'interpolation logarithmique y est
   une droite. Ce n'est pas un artifice de présentation — c'est exactement ce
   que l'œil perçoit, puisqu'il lit des rapports et non des différences. */
function graphe(G){
  const d0 = 16, d1 = 11820;                 // rayons de Schwarzschild
  const L0 = Math.log10(d0), L1 = Math.log10(d1);
  const X = 62, Y = 18, W = 470, H = 190;    // le cadre du tracé
  const px = t => X + t * W;
  const py = L => Y + H - (L - 1) / (L1 + 0.15 - 1) * H;
  const adouci = x => x < 0.5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3)/2;

  let logC = "", linC = "";
  for(let i = 0; i <= 100; i++){
    const t = i/100, k = adouci(t);
    const dLog = Math.pow(10, L0 + (L1 - L0) * k);
    const dLin = d0 + (d1 - d0) * k;
    logC += (i ? " L" : "M") + px(t).toFixed(1) + " " + py(Math.log10(dLog)).toFixed(1);
    linC += (i ? " L" : "M") + px(t).toFixed(1) + " " + py(Math.log10(dLin)).toFixed(1);
  }

  let g = '<svg viewBox="0 0 560 268" role="img" aria-label="' + G.titre.replace(/"/g, "") + '">';
  // les décades
  for(let d = 1; d <= 4; d++){
    const y = py(d);
    g += '<path class="s-l" d="M' + X + ' ' + y.toFixed(1) + ' H' + (X + W) + '"/>'
       + '<text class="s-num" x="' + (X - 8) + '" y="' + (y + 3).toFixed(1) + '" text-anchor="end">10' +
         '<tspan dy="-4" font-size="6.5">' + d + '</tspan></text>';
  }
  g += '<path class="s-l" d="M' + X + ' ' + Y + ' V' + (Y + H) + '"/>';

  // mi-course : le trait qui rend l'écart visible
  const tm = 0.5, km = adouci(tm);
  const yLog = py(Math.log10(Math.pow(10, L0 + (L1 - L0) * km)));
  const yLin = py(Math.log10(d0 + (d1 - d0) * km));
  g += '<path class="s-l" d="M' + px(tm) + ' ' + Y + ' V' + (Y + H) + '" stroke-dasharray="2 3"/>'
     + '<path d="M' + px(tm) + ' ' + yLin.toFixed(1) + ' V' + yLog.toFixed(1) + '" stroke="var(--appui)" stroke-width="1.4"/>'
     + '<circle cx="' + px(tm) + '" cy="' + yLog.toFixed(1) + '" r="3" fill="var(--accent)"/>'
     + '<circle cx="' + px(tm) + '" cy="' + yLin.toFixed(1) + '" r="3" fill="var(--appui)"/>'
     + '<text class="s-p" x="' + (px(tm) + 7) + '" y="' + (Y + 12) + '">' + G.mi + '</text>';

  g += '<path d="' + linC + '" fill="none" stroke="var(--appui)" stroke-width="1.6" stroke-dasharray="4 3"/>'
     + '<path d="' + logC + '" fill="none" stroke="var(--accent)" stroke-width="2"/>';

  // la légende, sous le cadre
  g += '<text class="s-p" x="' + X + '" y="' + (Y + H + 20) + '">' + G.axeX + '</text>'
     + '<rect x="' + X + '" y="' + (Y + H + 32) + '" width="18" height="2" fill="var(--accent)"/>'
     + '<text class="s-t" x="' + (X + 24) + '" y="' + (Y + H + 37) + '">' + G.log + '</text>'
     + '<rect x="' + X + '" y="' + (Y + H + 50) + '" width="18" height="2" fill="var(--appui)"/>'
     + '<text class="s-t" x="' + (X + 24) + '" y="' + (Y + H + 55) + '">' + G.lin + '</text>'
     + '</svg>';

  return '<figure>' + g + '<figcaption>' + G.titre + ' — ' + G.sousTitre + '.<br>' + G.note + '</figcaption></figure>';
}

/* ─────────────────────────── le niveau technique se rend en chapitres ouverts
   à la demande. On découpe sur les titres, sans toucher au contenu : la donnée
   reste un texte suivi, et c'est la page qui décide comment on y entre. */
function chapitres(html, figure, ancre){
  const bac = document.createElement("div");
  bac.innerHTML = html;
  const noeuds = [].slice.call(bac.childNodes);
  const parts = [];
  let cour = null, avant = [];
  noeuds.forEach(function(n){
    if(n.nodeType === 1 && n.tagName === "H2"){
      cour = { titre: n.textContent, dedans: [] };
      parts.push(cour);
    } else if(cour) cour.dedans.push(n);
    else avant.push(n);                     // ce qui précède le premier titre n'est pas perdu
  });
  if(!parts.length) return bac;

  const sortie = document.createElement("div");
  avant.forEach(function(n){ sortie.appendChild(n); });
  parts.forEach(function(p, i){
    const d = document.createElement("details");
    d.className = "chap";
    if(i === 0) d.open = true;              // le premier est ouvert : on entre quelque part
    const s = document.createElement("summary");
    s.textContent = p.titre;
    const c = document.createElement("div");
    c.className = "dedans";
    p.dedans.forEach(function(n){ c.appendChild(n); });
    d.appendChild(s); d.appendChild(c);
    sortie.appendChild(d);
  });

  /* La figure va DANS le chapitre qu'elle illustre, pas en tête de page. On la
     pose sur une ancre de contenu — la formule, identique dans les trois
     langues — plutôt que sur un rang de chapitre, qui bougerait au premier
     paragraphe déplacé. */
  if(figure){
    const dedans = [].slice.call(sortie.querySelectorAll(".dedans"));
    let cible = null;
    dedans.forEach(function(d){ if(!cible && d.textContent.indexOf(ancre) >= 0) cible = d; });
    if(cible){
      const f = document.createElement("div");
      f.innerHTML = figure;
      cible.insertBefore(f.firstElementChild, cible.firstChild);
      const chap = cible.parentElement;
      if(chap && chap.tagName === "DETAILS") chap.open = true;
    }
  }
  return sortie;
}

// ───────────────────────────────────────────────────────────────────── le rendu
function rend(){
  const T = J[lg];
  document.documentElement.lang = lg;
  $("marque").textContent  = T.marque;
  $("numero").textContent  = T.numero;
  $("titre").textContent   = T.titre;
  $("chapeau").textContent = T.chapeau;
  $("versSite").textContent = T.versLeSite + " →";
  $("pied").innerHTML      = T.pied;
  document.title = T.titre + " — " + T.marque;

  const nv = $("niveaux");
  nv.innerHTML = "";
  T.niveaux.forEach(function(nom, i){
    const b = document.createElement("button");
    b.type = "button"; b.setAttribute("role", "tab");
    b.textContent = nom;
    b.className = i === niv ? "actif" : "";
    b.setAttribute("aria-selected", i === niv ? "true" : "false");
    b.onclick = function(){ niv = i; rend(); window.scrollTo({ top:0 }); };
    nv.appendChild(b);
  });

  const lgs = $("langues");
  lgs.innerHTML = "";
  LANGUES.forEach(function(k){
    const b = document.createElement("button");
    b.type = "button"; b.textContent = k;
    b.title = J[k].langue;
    b.className = k === lg ? "actif" : "";
    b.onclick = function(){
      lg = k;
      const u = new URL(location);
      u.searchParams.set("l", k);
      history.replaceState(null, "", u);
      rend();
    };
    lgs.appendChild(b);
  });

  const c = $("corps");
  c.classList.remove("parait");
  c.innerHTML = "";

  if(niv === 2){
    /* L'ancre est la formule LaTeX elle-même : elle n'est traduite dans aucune
       des trois langues, et `outil-verif-journal.js` vérifie qu'elle y est
       encore. Ce contrôle a déjà servi — le passage des formules en LaTeX avait
       fait disparaître le graphe, et rien à l'écran ne le disait. */
    c.appendChild(chapitres(T.corps[2], graphe(T.graphe), "\\log_{10} d(t)"));
  } else {
    let html = T.corps[niv];
    if(niv === 0) html = html.replace("<h2>", schema(T.schema) + "<h2>");
    c.innerHTML = html;
  }

  composeMaths(c);
