<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Trou noir — orbites autour de Sagittarius A*</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:#e8e6f0; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #gl { z-index:0; }
  #ui { z-index:1; pointer-events:none; }
  .hud { position:fixed; z-index:2; user-select:none; }

  /* ---- colonne de gauche : titre + fiches ---- */
  #gauche { top:26px; left:28px; width:352px; pointer-events:none; }
  #titre h1 { font-size:13px; font-weight:600; letter-spacing:.42em; text-transform:uppercase; color:#fff; opacity:.92; }
  #titre p { margin-top:7px; font-size:11px; letter-spacing:.03em; color:#8b86a3; }

  #fiches {
    margin-top:18px; pointer-events:auto;
    background:rgba(10,8,20,.55); backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.10); border-radius:12px; padding:14px;
  }
  #niveaux { display:grid; grid-template-columns:repeat(3,1fr); gap:5px; margin-bottom:13px; }
  #niveaux button { padding:6px 2px; font-size:10px; letter-spacing:.02em; }

  #f-tete { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:8px; }
  #f-titre { font-size:14px; font-weight:600; color:#fff; letter-spacing:.01em; line-height:1.3; }
  #f-num { font-size:9.5px; color:#6d6885; font-variant-numeric:tabular-nums; white-space:nowrap; }
  #f-texte {
    font-size:12px; line-height:1.68; color:#b8b3cc;
    max-height:min(35vh, 290px); overflow-y:auto; padding-right:4px;
  }
  #f-texte::-webkit-scrollbar { width:3px; }
  #f-texte::-webkit-scrollbar-thumb { background:rgba(255,255,255,.18); border-radius:2px; }
  #f-texte b { color:#e4e0f0; font-weight:600; }
  #f-texte i { color:#7fd8ff; font-style:normal; }

  #f-pied { display:flex; align-items:center; gap:9px; margin-top:12px; }
  #f-pied button { padding:5px 11px; font-size:13px; line-height:1; }
  #points { display:flex; gap:5px; flex:1; justify-content:center; }
  #points span {
    width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,.20);
    cursor:pointer; transition:background .15s, transform .15s;
  }
  #points span:hover { transform:scale(1.4); }
  #points span.actif { background:#7fd8ff; }

  /* ---- compteurs ---- */
  #stats { top:26px; right:28px; text-align:right; pointer-events:none; }
  .stat { margin-bottom:10px; }
  .stat b { display:block; font-size:21px; font-weight:500; font-variant-numeric:tabular-nums; line-height:1; }
  .stat span { display:block; margin-top:4px; font-size:9px; letter-spacing:.19em; text-transform:uppercase; color:#8b86a3; }
  .stat.orbite b { color:#7fd8ff; }
  .stat.chute  b { color:#ff5d7a; }
  .stat.fuite  b { color:#6effb4; }

  /* ---- panneau ---- */
  #panneau {
    bottom:24px; right:28px; width:252px; pointer-events:auto;
    background:rgba(10,8,20,.55); backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.10); border-radius:12px; padding:14px;
  }
  .bloc { margin-bottom:12px; }
  .bloc:last-child { margin-bottom:0; }
  .etiq { font-size:8.5px; letter-spacing:.2em; text-transform:uppercase; color:#7d7894; margin-bottom:7px; }

  button {
    font:inherit; font-size:11.5px; color:#ddd8ec; cursor:pointer;
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12);
    border-radius:7px; padding:7px 10px; transition:background .13s, border-color .13s, color .13s;
  }
  button:hover { background:rgba(255,255,255,.14); border-color:rgba(255,255,255,.24); }
  button.actif { background:rgba(127,216,255,.20); border-color:rgba(127,216,255,.5); color:#d6f2ff; }
  button:disabled { opacity:.4; cursor:default; }
  button:disabled:hover { background:rgba(255,255,255,.07); border-color:rgba(255,255,255,.12); }
  .rangee { display:flex; gap:6px; }
  .rangee button { flex:1; }
  .grille { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .grille button { padding:6px 4px; font-size:10.5px; }

  #lecture {
    font-size:10.5px; line-height:1.65; color:#a29dba; font-variant-numeric:tabular-nums;
    border-top:1px solid rgba(255,255,255,.09); padding-top:11px;
  }
  #lecture .gros { color:#fff; font-size:14px; letter-spacing:.02em; }
  #lecture .note { display:block; margin-top:6px; color:#6d6885; font-size:9.5px; line-height:1.55; }

  /* ---- aide ---- */
  #aide { bottom:24px; left:28px; font-size:11px; letter-spacing:.03em; color:#7d7894; line-height:1.75; pointer-events:none; max-width:32ch; }
  kbd { font:inherit; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.13); border-radius:4px; padding:0 5px; color:#c2bcd6; }

  #flash {
    position:fixed; inset:0; z-index:3; pointer-events:none;
    background:radial-gradient(circle at center, rgba(255,70,90,.42), transparent 60%);
    opacity:0; transition:opacity .5s ease-out;
  }
  #msg {
    position:fixed; z-index:4; left:50%; bottom:13%; transform:translateX(-50%);
    font-size:11.5px; letter-spacing:.22em; text-transform:uppercase; color:#fff;
    opacity:0; transition:opacity .3s; pointer-events:none; text-shadow:0 0 20px #000;
  }

  @media (max-width:900px) {
    #gauche { top:16px; left:16px; right:16px; width:auto; }
    #titre p { display:none; }
    #stats { display:none; }
    #aide  { display:none; }
    #panneau { bottom:16px; right:16px; left:16px; width:auto; padding:12px; }
    #f-texte { max-height:26vh; }
  }
</style>
</head>
<body>

<canvas id="gl"></canvas>
<canvas id="ui"></canvas>
<div id="flash"></div>
<div id="msg"></div>

<div class="hud" id="gauche">
  <div id="titre">
    <h1>Trou noir</h1>
    <p>Sagittarius A* — rien de ce que tu vois derrière n'est vraiment là.</p>
  </div>

  <div id="fiches">

</div>

  <div class="stat orbite"><b id="s-orbite">0</b><span>en orbite</span></div>

</div>

  <div class="bloc">
    <div class="rangee">
      <button id="b-pluie">Lâcher 80 sondes</button>

    </div>
  </div>

    <div class="rangee">

</div>

<div class="hud" id="aide">
  Glisse depuis un point du disque pour lancer une sonde à la main.<br>
  <kbd>molette</kbd> zoom · <kbd>clic droit</kbd> pivoter · <kbd>espace</kbd> pluie · <kbd>P</kbd> photon · <kbd>T</kbd> trajectoires
</div>

<script id="vs" type="x-shader">#version 300 es
in vec2 aPos;
void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }
</script>

<script id="fs" type="x-shader">#version 300 es
precision highp float;
out vec4 outColor;

uniform vec2  uRes;
uniform float uTemps;        // temps simulé, en unités géométriques
uniform vec3  uCam;
uniform mat3  uBasis;        // colonnes : droite, haut, avant
uniform float uFocal;
uniform vec3  uPhotons[4];
uniform int   uNbPhotons;

const float R_IN  = 2.6;
const float R_OUT = 11.0;
const int   STEPS = 240;

// ---------- bruit ----------
float hash13(vec3 p){ p = fract(p*0.1031); p += dot(p, p.zyx + 31.32); return fract((p.x+p.y)*p.z); }
vec3  hash33(vec3 p){ p = fract(p*vec3(.1031,.1030,.0973)); p += dot(p, p.yxz+33.33); return fract((p.xxy+p.yxx)*p.zyx); }
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*.1031); p3 += dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }

float noise2(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
  return mix(mix(hash12(i), hash12(i+vec2(1,0)), f.x),
             mix(hash12(i+vec2(0,1)), hash12(i+vec2(1,1)), f.x), f.y);
}
float fbm2(vec2 p){ float s=0.0,a=0.5; for(int i=0;i<5;i++){ s+=a*noise2(p); p*=2.03; a*=0.5; } return s; }

float noise3(vec3 p){
  vec3 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
  return mix(mix(mix(hash13(i), hash13(i+vec3(1,0,0)), f.x),
                 mix(hash13(i+vec3(0,1,0)), hash13(i+vec3(1,1,0)), f.x), f.y),
             mix(mix(hash13(i+vec3(0,0,1)), hash13(i+vec3(1,0,1)), f.x),
                 mix(hash13(i+vec3(0,1,1)), hash13(i+vec3(1,1,1)), f.x), f.y), f.z);
}
float fbm3(vec3 p){ float s=0.0,a=0.5; for(int i=0;i<5;i++){ s+=a*noise3(p); p*=2.07; a*=0.5; } return s; }

// ---------- ciel ----------
vec3 couche(vec3 d, float ech, float seuil){
  vec3 p = d*ech, id = floor(p), f = p - id - 0.5;
  vec3 h = hash33(id);
  if(h.x > seuil) return vec3(0.0);
  float dist = length(f - (h-0.5)*0.72);
  float b = pow(smoothstep(0.16, 0.0, dist), 3.0);
  vec3 teinte = mix(vec3(0.62,0.72,1.0), vec3(1.0,0.84,0.60), h.y);
  return teinte * b * (0.35 + h.z);
}

vec3 ciel(vec3 d){
  // nébuleuse très sombre et par plaques, sinon elle noie les étoiles
  float n  = pow(fbm3(d*2.4), 2.6);
  float n2 = pow(fbm3(d*6.1 + 17.0), 3.2);
  vec3 neb = vec3(0.075,0.030,0.150) * n
           + vec3(0.010,0.040,0.095) * n2;
  float bande = exp(-pow(d.y*2.6, 2.0)*1.6);
  neb += vec3(0.055,0.048,0.090) * bande * n;
  vec3 e = couche(d,  95.0, 0.070)
         + couche(d, 205.0, 0.060) * 0.75
         + couche(d, 410.0, 0.050) * 0.48;
  return neb + e*2.3;
}

// ---------- disque d'accrétion ----------
vec4 disque(vec3 p, vec3 rd){
  float r = length(p.xz);
  float t = (r - R_IN) / (R_OUT - R_IN);
  float ang = atan(p.z, p.x);

  // rotation képlérienne : Ω = sqrt(M/r³), le gaz interne tourne bien plus vite
  float orbite = uTemps * 0.707 / pow(r, 1.5);
  vec2 q = vec2(cos(ang - orbite), sin(ang - orbite)) * r;

  // une part du bruit tourne en bloc : sans elle, le cisaillement képlérien
  // finit par étirer toute la structure en anneaux parfaits
  float rigide = uTemps * 0.035;
  vec2 qr = vec2(cos(ang - rigide), sin(ang - rigide)) * r;

  float n   = 0.55*fbm2(q*0.85) + 0.45*fbm2(qr*1.25 + 21.0);
  float fil = fbm2(q*2.4 + 7.0);

  float dens = smoothstep(0.0, 0.12, t) * smoothstep(1.0, 0.55, t);
  dens *= 0.35 + 1.15*n;
  dens *= 0.65 + 0.65*fil;

  // profil de température : chaud/bleu au bord interne, froid/orange au large
  float chaleur = pow(1.0 - t, 1.35);
  vec3 col = mix(vec3(1.00,0.42,0.10), vec3(1.00,0.93,0.86), chaleur);
  col = mix(col, vec3(0.72,0.86,1.00), pow(chaleur, 3.4)*0.75);

  float lum = 2.4 / pow(r*0.42, 1.15);

  // Doppler : le côté qui vient vers nous est bien plus brillant
  vec3 vit = normalize(cross(vec3(0.0,1.0,0.0), p)) * sqrt(0.5/r);
  float beta = clamp(dot(vit, -rd), -0.85, 0.85);
  float dop  = 1.0 / (1.0 - beta);
  lum *= pow(dop, 3.0);
  col *= vec3(pow(dop, 0.55), 1.0, pow(dop, -0.45));

  lum *= sqrt(max(1.0 - 1.0/r, 0.02));      // décalage gravitationnel vers le rouge

  return vec4(col*lum*dens, clamp(dens*1.5, 0.0, 1.0));
}

void main(){
  vec2 uv = (gl_FragCoord.xy*2.0 - uRes) / uRes.y;
  vec3 dir = normalize(uBasis[0]*uv.x + uBasis[1]*uv.y + uBasis[2]*uFocal);
  vec3 pos = uCam;

  // moment cinétique du photon : pilote la courbure de sa trajectoire
  vec3 L = cross(pos, dir);
  float h2 = dot(L, L);

  vec3  col   = vec3(0.0);
  float reste = 1.0;
  bool  avale = false;
  float lueur = 0.0;

  for(int i = 0; i < STEPS; i++){
    float r = length(pos);
    if(r < 1.0){ avale = true; break; }
    if(r > 70.0 && dot(pos, dir) > 0.0) break;

    float dt = clamp(r*0.085, 0.045, 1.4);

    // pas plus fin près d'un photon, sinon il scintille
    for(int k = 0; k < 4; k++){
      if(k >= uNbPhotons) break;
      dt = min(dt, max(0.05, length(uPhotons[k]-pos)*0.40));
    }

    vec3 acc = -1.5 * h2 * pos / pow(r, 5.0);
    vec3 np  = pos + dir*dt + 0.5*acc*dt*dt;
    vec3 nd  = normalize(dir + acc*dt);

    // traversée du plan du disque
    if(pos.y*np.y < 0.0 && reste > 0.004){
      float f  = pos.y / (pos.y - np.y);
      vec3  cp = mix(pos, np, f);
      float rr = length(cp.xz);
      if(rr > R_IN && rr < R_OUT){
        vec4 d = disque(cp, dir);
        col   += reste * d.rgb;
        reste *= 1.0 - d.a*0.86;
      }
    }

    for(int k = 0; k < 4; k++){
      if(k >= uNbPhotons) break;
      vec3 q = uPhotons[k] - pos;
      lueur += exp(-dot(q,q)*26.0) * dt * reste;
    }

    pos = np; dir = nd;
  }

  if(!avale) col += reste * ciel(dir);

  col += vec3(1.0, 0.98, 0.92) * lueur * 7.0;   // le photon, lensé comme le reste

  // exposition + tonemap ACES approché
  col *= 1.15;
  col = (col*(2.51*col + 0.03)) / (col*(2.43*col + 0.59) + 0.14);
  col = pow(clamp(col, 0.0, 1.0), vec3(1.0/2.2));

  // tramage : sans ça le dégradé du fond se casse en anneaux sur 8 bits
  col += (hash12(gl_FragCoord.xy + fract(uTemps)*137.0) - 0.5) / 220.0;

  col *= 1.0 - 0.28*pow(length(uv*vec2(0.55,0.75)), 2.4);   // vignettage

  outColor = vec4(col, 1.0);
}
</script>

<script>
"use strict";

/* ===========================================================
   Unités : la longueur vaut 1 rayon de Schwarzschild (rs),
   la vitesse vaut c. Pour Sagittarius A* (4,3e6 M☉) :
     rs = 1,269e7 km,  et la lumière met 42,3 s à le franchir.
   Tout le reste en découle.
   =========================================================== */
const SEC_PAR_UNITE = 42.34;      // secondes réelles pour 1 rs à la vitesse c
const KM_PAR_UNITE  = 1.269e7;
const M         = 0.5;            // horizon en r = 2M = 1
const R_HORIZON = 1.0;
const R_PHOTON  = 1.5;            // sphère des photons
const R_ISCO    = 3.0;            // dernière orbite circulaire stable (6M)
const R_OMBRE   = 2.55;           // rayon apparent de l'ombre, pour l'occlusion
const MAX_SONDES = 420;

// ============ WebGL ============
const cv = document.getElementById("gl");
const gl = cv.getContext("webgl2", { antialias:false, alpha:false, powerPreference:"high-performance" });
if(!gl){
  document.body.innerHTML = "<p style='padding:40px;font:14px sans-serif;color:#ccc'>Ton navigateur ne supporte pas WebGL2.</p>";
  throw new Error("WebGL2 indisponible");
}

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src.trim()); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER,   document.getElementById("vs").textContent));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, document.getElementById("fs").textContent));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

gl.bindVertexArray(gl.createVertexArray());
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

const U = n => gl.getUniformLocation(prog, n);
const uRes = U("uRes"), uTemps = U("uTemps"), uCam = U("uCam"), uBasis = U("uBasis"),
      uFocal = U("uFocal"), uPhotons = U("uPhotons"), uNbPhotons = U("uNbPhotons");

// ============ vecteurs ============
const cross = (u,v) => [u[1]*v[2]-u[2]*v[1], u[2]*v[0]-u[0]*v[2], u[0]*v[1]-u[1]*v[0]];
const dot   = (u,v) => u[0]*v[0]+u[1]*v[1]+u[2]*v[2];
const len   = u     => Math.hypot(u[0],u[1],u[2]);
const norm  = v => { const l = len(v) || 1; return [v[0]/l, v[1]/l, v[2]/l]; };

// ============ caméra ============
const cam = { dist:21, elev:0.17, azim:0.6 };
const FOCAL = 1.55;
let basis = { d:[1,0,0], h:[0,1,0], a:[0,0,1] }, camPos = [0,0,0];

function majCamera(){
  const ce = Math.cos(cam.elev), se = Math.sin(cam.elev);
  camPos = [ cam.dist*ce*Math.cos(cam.azim), cam.dist*se, cam.dist*ce*Math.sin(cam.azim) ];
  const a = norm([-camPos[0], -camPos[1], -camPos[2]]);
  const d = norm(cross(a, [0,1,0]));
  basis = { d, h: cross(d, a), a };
}

// monde -> pixel. Projection droite : la lentille n'est pas prise en compte,
// c'est un calque de repérage posé par-dessus l'image relativiste.
function projette(p){
  const q = [p[0]-camPos[0], p[1]-camPos[1], p[2]-camPos[2]];
  const z = dot(q, basis.a);
  if(z <= 0.05) return null;
  const H = cv.clientHeight, W = cv.clientWidth;
  return [ (dot(q, basis.d)/z*FOCAL*H + W)/2, H - (dot(q, basis.h)/z*FOCAL*H + H)/2 ];
}

// vrai si le trou noir passe entre la caméra et le point
function occulte(p){
  const q = [p[0]-camPos[0], p[1]-camPos[1], p[2]-camPos[2]];
  const t = -dot(camPos, q) / dot(q, q);
  if(t <= 0 || t >= 1) return false;
  return len([camPos[0]+q[0]*t, camPos[1]+q[1]*t, camPos[2]+q[2]*t]) < R_OMBRE;
}

// pixel -> point du plan du disque (y = 0)
function surLePlan(px, py){
  const H = cv.clientHeight, W = cv.clientWidth;
  const ux = (px*2 - W)/H, uy = ((H - py)*2 - H)/H;
  const dir = norm([
    basis.d[0]*ux + basis.h[0]*uy + basis.a[0]*FOCAL,
    basis.d[1]*ux + basis.h[1]*uy + basis.a[1]*FOCAL,
    basis.d[2]*ux + basis.h[2]*uy + basis.a[2]*FOCAL,
  ]);
  if(Math.abs(dir[1]) < 1e-4) return null;
  const t = -camPos[1] / dir[1];
  if(t <= 0) return null;
  return [ camPos[0]+dir[0]*t, 0, camPos[2]+dir[2]*t ];
}

// ============ physique ============
// Matière : Newton + correction relativiste, qui fait précesser le périastre
// et rend la capture possible même sans viser le centre.
function acceleration(p, v){
  const r = len(p);
  const L = cross(p, v);
  const k = -M / (r*r*r) * (1 + 3*dot(L,L)/(r*r));
  return [ k*p[0], k*p[1], k*p[2] ];
}
function integre(p, v, dt){
  const a  = acceleration(p, v);
  const pm = [ p[0]+v[0]*dt*0.5, p[1]+v[1]*dt*0.5, p[2]+v[2]*dt*0.5 ];
  const vm = [ v[0]+a[0]*dt*0.5, v[1]+a[1]*dt*0.5, v[2]+a[2]*dt*0.5 ];
  const am = acceleration(pm, vm);
  return [[ p[0]+vm[0]*dt, p[1]+vm[1]*dt, p[2]+vm[2]*dt ],
          [ v[0]+am[0]*dt, v[1]+am[1]*dt, v[2]+am[2]*dt ]];
}

// Lumière : même équation que le shader. h² est constant le long du rayon.
function integrePhoton(p, d, h2, dt){
  const r = len(p);
  const k = -1.5*h2 / Math.pow(r, 5);
  const a = [ k*p[0], k*p[1], k*p[2] ];
  return [[ p[0]+d[0]*dt+0.5*a[0]*dt*dt, p[1]+d[1]*dt+0.5*a[1]*dt*dt, p[2]+d[2]*dt+0.5*a[2]*dt*dt ],
          norm([ d[0]+a[0]*dt, d[1]+a[1]*dt, d[2]+a[2]*dt ])];
}

const vCirc = r => Math.sqrt(M/r);

// ============ sondes ============
const TEINTES = {
  orbite: [127, 216, 255],
  chute:  [255,  93, 122],
  fuite:  [110, 255, 180],
};

const sondes = [];
let nChute = 0, nFuite = 0;

// On intègre l'avenir de la sonde une fois, au lancement : ça donne à la fois
// son sort (orbite / chute / fuite) et le tracé complet à afficher.
function destin(p0, v0){
  let p = [...p0], v = [...v0];
  const chemin = [];
  let sort = "orbite";
  for(let i = 0; i < 2600; i++){
    [p, v] = integre(p, v, 0.10);
    if((i & 7) === 0) chemin.push([p[0], p[1], p[2]]);
    const r = len(p);
    if(r < R_HORIZON*1.05){ sort = "chute"; break; }
    if(r > 50){ sort = "fuite"; break; }
  }
  return { sort, chemin };
}

function lance(p, v){
  const { sort, chemin } = destin(p, v);
  if(sondes.length >= MAX_SONDES) sondes.shift();
  sondes.push({ p:[...p], v:[...v], sort, chemin, trace:[] });
}

function pluie(n = 80){
  for(let i = 0; i < n; i++){
    const r = 2.2 + Math.random()*11;
    const a = Math.random()*6.2832;
    const p = [ Math.cos(a)*r, (Math.random()-0.5)*0.7, Math.sin(a)*r ];
    // tangentielle, plus ou moins vite que l'orbite circulaire — c'est ce
    // facteur qui décide de tout
    const t = norm(cross([0,1,0], p));
    const rad = norm([p[0], 0, p[2]]);
    // 1 = orbite circulaire, √2 ≈ 1,414 = vitesse de libération. Il faut couvrir
    // les deux seuils pour voir les trois familles se séparer.
    const f = 0.40 + Math.random()*1.25;
    const vc = vCirc(r);
    lance(p, [
      t[0]*vc*f + rad[0]*(Math.random()-0.5)*0.10,
      (Math.random()-0.5)*0.10,
      t[2]*vc*f + rad[2]*(Math.random()-0.5)*0.10,
    ]);
  }
}

// ============ photons ============
const photons = [];

function lancePhoton(){
  // juste au-dessus de la sphère des photons, tangentiellement : l'orbite est
  // instable, il fait quelques tours puis part. Placé face à la caméra.
  const a = cam.azim;
  const p = [ Math.cos(a)*R_PHOTON*1.008, 0, Math.sin(a)*R_PHOTON*1.008 ];
  const d = norm(cross([0,1,0], p));
  const L = cross(p, d);
  if(photons.length >= 4) photons.shift();
  photons.push({ p, d, h2:dot(L,L), parcours:0, angle:0, trace:[] });
}

const VITESSES = [
  { mult:1,    nom:"temps réel" },
  { mult:60,   nom:"1 min / s"  },
  { mult:600,  nom:"10 min / s" },
  { mult:3600, nom:"1 h / s"    },
];
let iVitesse = 2;
let tempsGeo = 0;           // temps simulé, en unités géométriques

function avance(dtSec){
  const dtGeo = dtSec * VITESSES[iVitesse].mult / SEC_PAR_UNITE;
  tempsGeo += dtGeo;

  // sondes
  const n = Math.max(1, Math.min(Math.ceil(dtGeo/0.03), 32));
  const pas = dtGeo/n;
  for(let i = sondes.length - 1; i >= 0; i--){
    const s = sondes[i];
    for(let k = 0; k < n; k++){
      const [np, nv] = integre(s.p, s.v, pas);
      s.p = np; s.v = nv;
    }
    s.trace.push([s.p[0], s.p[1], s.p[2]]);
    if(s.trace.length > 46) s.trace.shift();

    const r = len(s.p);
    if(r < R_HORIZON*1.1){ sondes.splice(i,1); nChute++; flash(); message("avalée"); }
    else if(r > 52)      { sondes.splice(i,1); nFuite++; }
  }

  // photons — pas plus fin, ils frôlent l'horizon
  const np_ = Math.max(1, Math.min(Math.ceil(dtGeo/0.012), 96));
  const pasP = dtGeo/np_;
  for(let i = photons.length - 1; i >= 0; i--){
    const f = photons[i];
    for(let k = 0; k < np_; k++){
      const a0 = Math.atan2(f.p[2], f.p[0]);
      const [np2, nd] = integrePhoton(f.p, f.d, f.h2, pasP);
      f.p = np2; f.d = nd;
      let da = Math.atan2(f.p[2], f.p[0]) - a0;
      if(da >  Math.PI) da -= 6.2832;
      if(da < -Math.PI) da += 6.2832;
      f.angle += Math.abs(da);
      f.parcours += pasP;
    }
    f.trace.push([f.p[0], f.p[1], f.p[2]]);
    if(f.trace.length > 200) f.trace.shift();

    const r = len(f.p);
    if(r < R_HORIZON*1.02){ photons.splice(i,1); message("photon absorbé"); }
    else if(r > 45)       { photons.splice(i,1); message("photon échappé"); }
  }
}

const K_GLISSE = 1.6;   // hauteurs d'écran par unité de vitesse

// Le glissement se lit en repère écran, pas dans le plan du disque : vu presque
// par la tranche, quelques pixels vers le haut valent des dizaines d'unités.
function vitesseDepuisGlisse(v){
  const H = cv.clientHeight;
  const dx = (v.x - v.x0)/H, dy = (v.y0 - v.y)/H;
  const l = Math.hypot(dx, dy);
  if(l < 0.012) return null;
  const rp = norm([basis.d[0], 0, basis.d[2]]);   // axes de l'écran rabattus
  const hp = norm([basis.h[0], 0, basis.h[2]]);   // dans le plan du disque
  const dir = norm([ rp[0]*dx + hp[0]*dy, 0, rp[2]*dx + hp[2]*dy ]);
  const vitesse = Math.min(l*K_GLISSE, 0.9);
  return { v:[dir[0]*vitesse, 0, dir[2]*vitesse], vitesse };
}

const pointeur = e => { const r = cv.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; };
cv.style.touchAction = "none";
cv.addEventListener("contextmenu", e => e.preventDefault());

cv.addEventListener("pointerdown", e => {
  cv.setPointerCapture(e.pointerId);
  const [px, py] = pointeur(e);
  if(e.button === 2 || e.shiftKey){
    pivot = { x:px, y:py, azim:cam.azim, elev:cam.elev };
    return;
  }
  const p = surLePlan(px, py);
  if(!p) return;
  const r = Math.hypot(p[0], p[2]);
  if(r < 1.6 || r > 40) return;
  visee = { depart:p, x:px, y:py, x0:px, y0:py };
});

cv.addEventListener("pointermove", e => {
  const [px, py] = pointeur(e);
  if(pivot){
    cam.azim = pivot.azim - (px - pivot.x)*0.006;
    cam.elev = Math.max(-1.35, Math.min(1.35, pivot.elev + (py - pivot.y)*0.005));
  } else if(visee){ visee.x = px; visee.y = py; }
});

cv.addEventListener("pointerup", () => {
  if(pivot){ pivot = null; return; }
  if(!visee) return;
  const g = vitesseDepuisGlisse(visee);
  if(g) lance(visee.depart, g.v);
  visee = null;
});

cv.addEventListener("wheel", e => {
  e.preventDefault();
  cam.dist = Math.max(6, Math.min(46, cam.dist * (1 + Math.sign(e.deltaY)*0.09)));
}, { passive:false });

}

const boitierP = $("points");
FICHES.forEach((f, i) => {
  const s = document.createElement("span");
  s.title = f.titre;
  s.onclick = () => { iFiche = i; majFiche(); };
  boitierP.appendChild(s);
});

function majFiche(){
  const f = FICHES[iFiche];
  $("f-titre").textContent = f.titre;
  $("f-num").textContent   = (iFiche+1) + " / " + FICHES.length;
  $("f-texte").innerHTML   = f.t[iNiveau];
  $("f-texte").scrollTop   = 0;
  [...boitierN.children].forEach((c,i) => c.classList.toggle("actif", i === iNiveau));
  [...boitierP.children].forEach((c,i) => c.classList.toggle("actif", i === iFiche));
}
const vaFiche = d => { iFiche = (iFiche + d + FICHES.length) % FICHES.length; majFiche(); };
$("f-prec").onclick = () => vaFiche(-1);
$("f-suiv").onclick = () => vaFiche(1);
majFiche();

// ============ dessin du calque ============
function trace(pts, sur, alpha, ep){
  if(pts.length < 2) return;
  ctx.strokeStyle = `rgba(${sur[0]},${sur[1]},${sur[2]},${alpha})`;
  ctx.lineWidth = ep;
  ctx.beginPath();
  let ouvert = false;
  for(let i = 0; i < pts.length; i++){
    const q = projette(pts[i]);
    if(!q){ ouvert = false; continue; }
    if(ouvert) ctx.lineTo(q[0], q[1]); else { ctx.moveTo(q[0], q[1]); ouvert = true; }
  }
  ctx.stroke();
}

function dessine(){
  ctx.clearRect(0, 0, ui.clientWidth, ui.clientHeight);
  ctx.globalCompositeOperation = "lighter";

  // cercle repère : la dernière orbite stable
  ctx.globalCompositeOperation = "source-over";
  const cercle = [];
  for(let i = 0; i <= 96; i++){
    const a = i/96*6.2832;
    cercle.push([Math.cos(a)*R_ISCO, 0, Math.sin(a)*R_ISCO]);
  }
  ctx.setLineDash([2, 7]);
  trace(cercle, [255,255,255], 0.13, 1);
  ctx.setLineDash([]);
  ctx.globalCompositeOperation = "lighter";

  // trajectoires complètes, calculées au lancement
  if(montreTraj) for(const s of sondes) trace(s.chemin, TEINTES[s.sort], 0.17, 1);

  // traînées vives
  for(const s of sondes) trace(s.trace, TEINTES[s.sort], 0.30, 1.1);
  for(const f of photons) trace(f.trace, [255,250,235], 0.30, 1.1);

  // têtes
  for(const s of sondes){
    if(occulte(s.p)) continue;
    const q = projette(s.p);
    if(!q) continue;
    const c = TEINTES[s.sort];
    ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},0.20)`;
    ctx.beginPath(); ctx.arc(q[0], q[1], 4.2, 0, 6.2832); ctx.fill();
    ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},0.95)`;
    ctx.beginPath(); ctx.arc(q[0], q[1], 1.5, 0, 6.2832); ctx.fill();
  }

  // visée
  if(visee){
    const a = projette(visee.depart);
    const g = vitesseDepuisGlisse(visee);
    if(a){
      const r0 = Math.hypot(visee.depart[0], visee.depart[2]);
      const bon = g ? Math.max(0, 1 - Math.abs(g.vitesse/vCirc(r0) - 1)*1.6) : 0;
      const c = [Math.round(255-128*bon), Math.round(120+96*bon), Math.round(140+115*bon)];
      if(g){
        ctx.setLineDash([4, 5]);
        trace(destin(visee.depart, g.v).chemin, c, 0.6, 1.2);
        ctx.setLineDash([]);
      }
      trace([visee.depart], c, 0, 1);
      ctx.strokeStyle = `rgba(${c[0]},${c[1]},${c[2]},0.85)`;
      ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(visee.x, visee.y); ctx.stroke();
      ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},1)`;
      ctx.beginPath(); ctx.arc(a[0], a[1], 3.5, 0, 6.2832); ctx.fill();
    }
  }

  ctx.globalCompositeOperation = "source-over";
}

// ============ boucle ============
let echelle = 1.0, tPrec = performance.now(), images = 0, cumul = 0;

function redimensionne(){
  const W = innerWidth, H = innerHeight, dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width  = Math.round(W*dpr*echelle);  cv.height = Math.round(H*dpr*echelle);
  ui.width  = Math.round(W*dpr);          ui.height = Math.round(H*dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gl.viewport(0, 0, cv.width, cv.height);
}
addEventListener("resize", redimensionne);
redimensionne();

const tampon = new Float32Array(12);

function boucle(now){
  const dt = Math.min((now - tPrec)/1000, 0.05);
  tPrec = now;

  // résolution adaptative : on préfère la fluidité au piqué
  images++; cumul += dt*1000;
  if(images === 90){
    const moy = cumul/images;
    if(moy > 26 && echelle > 0.55){ echelle = 0.62; redimensionne(); }
    else if(moy < 11 && echelle < 1.0){ echelle = 1.0; redimensionne(); }
    images = 0; cumul = 0;
  }

  avance(dt);
  cam.azim += dt*0.012;          // dérive lente, pour que la lentille vive
  majCamera();

  for(let i = 0; i < photons.length && i < 4; i++){
    tampon[i*3] = photons[i].p[0]; tampon[i*3+1] = photons[i].p[1]; tampon[i*3+2] = photons[i].p[2];
  }

  gl.uniform2f(uRes, cv.width, cv.height);
  gl.uniform1f(uTemps, tempsGeo);
  gl.uniform3fv(uCam, camPos);
  gl.uniformMatrix3fv(uBasis, false, new Float32Array([...basis.d, ...basis.h, ...basis.a]));
  gl.uniform1f(uFocal, FOCAL);
  gl.uniform3fv(uPhotons, tampon);
  gl.uniform1i(uNbPhotons, Math.min(photons.length, 4));
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  dessine();

  $("s-orbite").textContent = sondes.length;
  $("s-chute").textContent  = nChute;
  $("s-fuite").textContent  = nFuite;
  majLecture();

  if(tFlash && now - tFlash > 90)   { elFlash.style.opacity = "0"; tFlash = 0; }
  if(tMsg   && now - tMsg   > 1100) { elMsg.style.opacity   = "0"; tMsg   = 0; }

  requestAnimationFrame(boucle);
}

majCamera();
requestAnimationFrame(boucle);
</script>
